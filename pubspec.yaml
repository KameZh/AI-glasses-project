name: xreal_companion
description: A companion app for XREAL One AI glasses — connects your phone to the glasses for calls, files, AI and more.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Connectivity ────────────────────────────────────────────────────────────
  flutter_blue_plus: ^1.35.3        # BLE (Bluetooth Low Energy) – glasses pairing
  connectivity_plus: ^6.1.4         # Wi-Fi / mobile network status
  network_info_plus: ^6.1.3         # Local network details

  # ── Backend / API communication ──────────────────────────────────────────────
  dio: ^5.7.0                       # HTTP client (REST API calls to Django backend)
  web_socket_channel: ^3.0.1        # WebSocket (real-time events from Django Channels)
  flutter_secure_storage: ^9.2.2    # Secure JWT token storage

  # ── Calls & communication ────────────────────────────────────────────────────
  phone_state: ^4.0.1               # Monitor incoming/outgoing call state
  url_launcher: ^6.3.1              # Launch dialer, messages, email

  # ── Contacts ─────────────────────────────────────────────────────────────────
  flutter_contacts: ^1.1.9+1        # Read/write device contacts

  # ── File management ───────────────────────────────────────────────────────────
  file_picker: ^8.1.4               # Pick any file from device storage
  path_provider: ^2.1.5             # Access app sandboxed directories
  open_filex: ^4.5.0                # Open files with native apps
  share_plus: ^10.0.3               # Share files / content

  # ── Permissions ───────────────────────────────────────────────────────────────
  permission_handler: ^11.3.1       # Runtime permission management

  # ── State management ──────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1          # Reactive state management
  riverpod_annotation: ^2.6.1       # Code-gen annotations for Riverpod

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.6.2                # Declarative routing

  # ── Local data / caching ─────────────────────────────────────────────────────
  hive_flutter: ^1.1.0              # Fast local key-value store
  shared_preferences: ^2.3.3        # Simple persistent settings

  # ── Notifications ─────────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1  # Local push notifications

  # ── Audio / Voice ─────────────────────────────────────────────────────────────
  speech_to_text: ^7.0.0            # On-device speech recognition
  flutter_tts: ^4.2.0               # Text-to-speech output

  # ── AI / assistant ────────────────────────────────────────────────────────────
  google_generative_ai: ^0.4.7      # Gemini on-device AI integration

  # ── UI & animations ──────────────────────────────────────────────────────────
  google_fonts: ^6.2.1              # Typography (Inter, etc.)
  flutter_animate: ^4.5.0           # Micro-animations
  lottie: ^3.3.0                    # Lottie animation support
  shimmer: ^3.0.0                   # Shimmer loading placeholders
  cached_network_image: ^3.4.1      # Image caching

  # ── Media ─────────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2              # Pick images / videos from gallery or camera
  video_player: ^2.9.2              # Video playback

  # ── Utils ──────────────────────────────────────────────────────────────────────
  intl: ^0.19.0                     # Internationalisation / date formatting
  uuid: ^4.5.1                      # UUID generation
  logger: ^2.5.0                    # Structured logging

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13             # Code generation runner
  riverpod_generator: ^2.4.0        # Riverpod code generation
  json_serializable: ^6.8.0         # JSON serialisation code-gen
  hive_generator: ^2.0.0            # Hive type adapter code-gen

flutter:
  uses-material-design: true
  # assets and fonts will be added as they are created:
  # assets:
  #   - assets/images/
  #   - assets/animations/
  # Fonts are loaded via the google_fonts package (no local asset needed)
